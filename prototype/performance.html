<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cPanel — Performance</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="meridian.css">
  <style>
/* ===================================================================
   PERFORMANCE PAGE -- SPECIFIC STYLES
   =================================================================== */

.metrics-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-8);
}

.metric-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex; flex-direction: column; gap: var(--space-3);
}
.metric-card-header {
  display: flex; align-items: center; justify-content: space-between;
}
.metric-card-title {
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
  color: var(--text-secondary); text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
}
.metric-card-trend {
  font-size: var(--text-xs); color: var(--status-success);
  display: flex; align-items: center; gap: var(--space-1);
}
.metric-card-value {
  font-size: var(--text-xl); font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-tight);
}
.metric-card-sub {
  font-size: var(--text-sm); color: var(--text-tertiary);
}
.metric-bar {
  width: 100%; height: 8px;
  background: var(--bg-muted); border-radius: var(--radius-full);
  overflow: hidden;
}
.metric-bar-fill {
  height: 100%; border-radius: var(--radius-full);
  background: var(--accent);
  transition: width 0.8s var(--ease-out);
}

.resource-list {
  display: flex; flex-direction: column; gap: var(--space-3);
  margin-top: var(--space-1);
}
.resource-item {
  display: flex; justify-content: space-between; align-items: center;
  font-size: var(--text-sm);
}
.resource-item-label { color: var(--text-secondary); }
.resource-item-value { font-weight: var(--weight-semibold); color: var(--text-primary); }

/* Per-site breakdown */
.site-breakdown {
  margin-bottom: var(--space-8);
}
.section-heading {
  font-size: var(--text-lg); font-weight: var(--weight-semibold);
  margin-bottom: var(--space-4);
}

/* (breakdown-table styles removed — now uses shared .data-list) */

/* Error log summary */
.error-table {
  width: 100%; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); overflow: hidden;
  background: var(--bg-surface); margin-bottom: var(--space-8);
}
.error-head {
  display: grid;
  grid-template-columns: 80px 1fr 80px 120px;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  background: var(--bg-muted);
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--text-xs); font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  color: var(--text-tertiary); text-transform: uppercase;
}
.error-row {
  display: grid;
  grid-template-columns: 80px 1fr 80px 120px;
  gap: var(--space-4);
  align-items: center;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--border-subtle);
}
.error-row:last-child { border-bottom: none; }
.error-cell {
  font-size: var(--text-sm); color: var(--text-secondary);
}

/* Error type badges */
.error-badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-xs); font-weight: var(--weight-semibold);
  font-family: var(--font-mono);
}
.error-badge-500 { background: var(--status-error-bg); color: var(--status-error); }
.error-badge-404 { background: var(--status-warning-bg); color: var(--status-warning); }
.error-badge-403 { background: var(--status-info-bg); color: var(--status-info); }

/* Recommendations */
.recommendations {
  display: flex; flex-direction: column; gap: var(--space-3);
}
.suggestion-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex; align-items: flex-start; gap: var(--space-4);
}
.suggestion-icon {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
  background: var(--accent-subtle); color: var(--text-brand);
}
.suggestion-text { flex: 1; }
.suggestion-title {
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
  margin-bottom: var(--space-1);
}
.suggestion-desc {
  font-size: var(--text-sm); color: var(--text-tertiary);
}

@media (max-width: 768px) {
  .metrics-grid { grid-template-columns: 1fr; }
  .error-head, .error-row {
    grid-template-columns: 60px 1fr 60px;
  }
  .error-head > *:nth-child(4),
  .error-row > *:nth-child(4) { display: none; }
}

@media (max-width: 480px) {
  .error-head { display: none; }
  .error-row { grid-template-columns: 1fr auto; padding: var(--space-3) var(--space-4); }
  .error-row > *:nth-child(1) { display: none; }
  .suggestion-card { flex-direction: column; gap: var(--space-3); }
}
</style>
</head>
<body>
  <div class="layout-shell" id="layoutShell">
    <meridian-header initials="JA" user-name="Jesse Asklund" notification-badge></meridian-header>
    <meridian-sidebar active="performance"></meridian-sidebar>
    <main class="layout-main"><div class="main-content">

      <!-- Page Header -->
      <div class="page-header animate-in stagger-1">
        <div class="page-header-left">
          <div>
            <h1 class="page-title">Performance</h1>
            <div class="page-subtitle">Account metrics and optimization</div>
          </div>
        </div>
      </div>

      <!-- Metrics Grid -->
      <div class="metrics-grid animate-in stagger-2" id="metricsGrid"></div>

      <!-- Per-Website Breakdown -->
      <div class="site-breakdown animate-in stagger-3">
        <div class="section-heading">Per-Website Breakdown</div>
        <div id="breakdownTable"></div>
      </div>

      <!-- Error Log Summary -->
      <div class="animate-in stagger-4">
        <div class="section-heading">Recent Errors</div>
        <div id="errorTable"></div>
      </div>

      <!-- Recommendations -->
      <div class="animate-in stagger-5">
        <div class="section-heading">Recommendations</div>
        <div class="recommendations" id="recommendations"></div>
      </div>

    </div></main>
  </div>
  <script src="components/shell.js"></script>
  <script>
var MOCK_PERF = {
  bandwidth: { used: '28.4 GB', max: '100 GB', pct: 28, trend: '+12% vs last month' },
  visitors: { total: '12,847', unique: '8,234', trend: '+8% vs last month' },
  errors: { total: 23 },
  resources: { cpu: '34%', memory: '512 MB / 2 GB', io: '2.1 MB/s', entryProcs: '4 / 20' },
  perSite: [
    { domain: 'mystore.com', bandwidth: '12.3 GB', visitors: '5,234', errors: 12 },
    { domain: 'shop.example.com', bandwidth: '9.8 GB', visitors: '4,102', errors: 8 },
    { domain: 'blog.example.org', bandwidth: '4.1 GB', visitors: '2,841', errors: 3 },
    { domain: 'docs.mystore.com', bandwidth: '2.0 GB', visitors: '612', errors: 0 },
    { domain: 'portfolio.dev', bandwidth: '0.2 GB', visitors: '58', errors: 0 }
  ],
  recentErrors: [
    { type: '500', message: 'Internal Server Error in /wp-admin/admin-ajax.php', count: 12, lastSeen: '2 hours ago' },
    { type: '404', message: '/old-page-slug not found', count: 8, lastSeen: '5 hours ago' },
    { type: '403', message: 'Forbidden: /wp-content/debug.log', count: 3, lastSeen: '1 day ago' }
  ]
};

function renderMetrics() {
  var d = MOCK_PERF;
  var html = '';

  // Bandwidth
  html += '<div class="metric-card">'
    + '<div class="metric-card-header">'
    + '<div class="metric-card-title">Bandwidth</div>'
    + '<div class="metric-card-trend"><i class="ri-arrow-up-line" aria-hidden="true"></i> ' + esc(d.bandwidth.trend) + '</div>'
    + '</div>'
    + '<div class="metric-card-value">' + esc(d.bandwidth.used) + ' <span class="metric-card-sub">/ ' + esc(d.bandwidth.max) + '</span></div>'
    + '<div class="metric-bar"><div class="metric-bar-fill" style="width: ' + d.bandwidth.pct + '%;"></div></div>'
    + '</div>';

  // Visitors
  html += '<div class="metric-card">'
    + '<div class="metric-card-header">'
    + '<div class="metric-card-title">Visitors</div>'
    + '<div class="metric-card-trend"><i class="ri-arrow-up-line" aria-hidden="true"></i> ' + esc(d.visitors.trend) + '</div>'
    + '</div>'
    + '<div class="metric-card-value">' + esc(d.visitors.total) + '</div>'
    + '<div class="metric-card-sub">' + esc(d.visitors.unique) + ' unique visitors</div>'
    + '</div>';

  // Errors
  html += '<div class="metric-card">'
    + '<div class="metric-card-header">'
    + '<div class="metric-card-title">Errors</div>'
    + '</div>'
    + '<div class="metric-card-value" style="color: var(--status-error);">' + esc(String(d.errors.total)) + '</div>'
    + '<div class="metric-card-sub">Total errors this period</div>'
    + '</div>';

  // Resources
  html += '<div class="metric-card">'
    + '<div class="metric-card-header">'
    + '<div class="metric-card-title">Resources</div>'
    + '</div>'
    + '<div class="resource-list">'
    + '<div class="resource-item"><span class="resource-item-label">CPU Usage</span><span class="resource-item-value">' + esc(d.resources.cpu) + '</span></div>'
    + '<div class="resource-item"><span class="resource-item-label">Memory</span><span class="resource-item-value">' + esc(d.resources.memory) + '</span></div>'
    + '<div class="resource-item"><span class="resource-item-label">I/O Rate</span><span class="resource-item-value">' + esc(d.resources.io) + '</span></div>'
    + '<div class="resource-item"><span class="resource-item-label">Entry Procs</span><span class="resource-item-value">' + esc(d.resources.entryProcs) + '</span></div>'
    + '</div>'
    + '</div>';

  document.getElementById('metricsGrid').innerHTML = html;
}

function renderBreakdown() {
  var sites = MOCK_PERF.perSite;
  var html = '<div class="data-list perf-grid">'
    + '<div class="data-list-head">'
    + '<div>Website</div><div>Bandwidth</div><div>Visitors</div><div>Errors</div><div></div>'
    + '</div>';
  for (var i = 0; i < sites.length; i++) {
    var s = sites[i];
    var errClass = s.errors > 0 ? ' status-warn' : '';
    html += '<div class="data-list-row" onclick="location.href=\'websites.html#domain=' + esc(s.domain) + '\'" role="button" tabindex="0">'
      + '<div class="cell-name"><span>' + esc(s.domain) + '</span></div>'
      + '<div class="cell">' + esc(s.bandwidth) + '</div>'
      + '<div class="cell">' + esc(s.visitors) + '</div>'
      + '<div class="cell' + errClass + '">' + s.errors + '</div>'
      + '<div class="cell-action"><i class="ri-arrow-right-s-line" aria-hidden="true"></i></div>'
      + '</div>';
  }
  html += '</div>';
  document.getElementById('breakdownTable').innerHTML = html;
}

function renderErrors() {
  var errors = MOCK_PERF.recentErrors;
  var html = '<div class="error-table">'
    + '<div class="error-head">'
    + '<div>Type</div><div>Message</div><div>Count</div><div>Last Seen</div>'
    + '</div>';
  for (var i = 0; i < errors.length; i++) {
    var e = errors[i];
    html += '<div class="error-row">'
      + '<div class="error-cell"><span class="error-badge error-badge-' + esc(e.type) + '">' + esc(e.type) + '</span></div>'
      + '<div class="error-cell">' + esc(e.message) + '</div>'
      + '<div class="error-cell" style="font-weight: var(--weight-semibold);">' + esc(String(e.count)) + '</div>'
      + '<div class="error-cell">' + esc(e.lastSeen) + '</div>'
      + '</div>';
  }
  html += '</div>';
  document.getElementById('errorTable').innerHTML = html;
}

function renderRecommendations() {
  var recs = [
    { icon: 'ri-speed-line', title: 'Enable browser caching', desc: 'Could save up to 30% bandwidth' },
    { icon: 'ri-image-line', title: 'Optimize images', desc: 'Large images detected on mystore.com' }
  ];
  var html = '';
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    html += '<div class="suggestion-card">'
      + '<div class="suggestion-icon"><i class="' + r.icon + '" aria-hidden="true"></i></div>'
      + '<div class="suggestion-text">'
      + '<div class="suggestion-title">' + esc(r.title) + '</div>'
      + '<div class="suggestion-desc">' + esc(r.desc) + '</div>'
      + '</div>'
      + '</div>';
  }
  document.getElementById('recommendations').innerHTML = html;
}

renderMetrics();
renderBreakdown();
renderErrors();
renderRecommendations();
</script>
</body>
</html>
